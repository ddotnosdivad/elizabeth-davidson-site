# Netlify settings. The private preview (ed-preview-lt0osb8c) is deployed from this
# folder with the CLI; see README.md. A git-connected site would run the build below.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Photos and fonts rarely change: let browsers keep them for a week.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The stylesheet changes with the design. Pages link it as site.css?v=<build>, and
# browsers re-check it, so a deploy is never hidden behind an old cached copy.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
